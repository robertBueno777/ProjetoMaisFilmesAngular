<section>
    <button class="favorito-btn" (click)="alternarFavorito()">
        <span>{{ filme().favorito ? '\u2764' : '\u2661'}}</span>
    </button>
    <div class="imagem" >
        <img [src]="filme().imagem" [alt]="filme().titulo">
    </div>
    <div class="info-filme">
        <h2 class="texto-h2">{{ filme().titulo.toUpperCase() }}</h2>
        <h3 class="texto-h3">{{ filme().autoria }}</h3>
    </div>
</section>
